<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Reader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #007bff;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        select, input[type="range"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-speak {
            background-color: #007bff;
            color: white;
        }

        .btn-speak:hover {
            background-color: #0056b3;
        }

        .btn-stop {
            background-color: #dc3545;
            color: white;
        }

        .btn-stop:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Text Reader</h1>

        <textarea id="text-input" placeholder="Enter a word or sentence here..."></textarea>

        <div class="controls">
            <div class="control-group">
                <label for="voice-select">Voice</label>
                <select id="voice-select"></select>
            </div>
            <div class="control-group">
                <label for="rate">Speed: <span id="rate-value">1</span>x</label>
                <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
            </div>
        </div>

        <div class="button-group">
            <button class="btn-speak" id="speak-btn">🔊 Read Aloud</button>
            <button class="btn-stop" id="stop-btn">⏹️ Stop</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateInput = document.getElementById('rate');
        const rateValue = document.getElementById('rate-value');
        const speakBtn = document.getElementById('speak-btn');
        const stopBtn = document.getElementById('stop-btn');

        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);
            });
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        speakBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }

            const text = textInput.value.trim();

            if (text !== '') {
                const utterance = new SpeechSynthesisUtterance(text);
                const selectedOption = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
                
                utterance.voice = voices.find(voice => voice.name === selectedOption);
                utterance.rate = rateInput.value;

                synth.speak(utterance);
            }
        });

        stopBtn.addEventListener('click', () => {
            synth.cancel();
        });

        rateInput.addEventListener('input', () => {
            rateValue.textContent = rateInput.value;
        });
    </script>
</body>
</html>
